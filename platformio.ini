; ESP32RXVoter - receive-only voter client
; Hardware: WT32-ETH01 (ESP32 + LAN8720) + ES8311 codec (ADC only) + GPS w/ PPS

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
extra_scripts = pre:build_timestamp.py

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3

build_flags =
    -D CORE_DEBUG_LEVEL=0
